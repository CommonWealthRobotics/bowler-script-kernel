name: Test package
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:

  # ---------------------------------------------------------------------
  # Original Linux job (unchanged)
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install updated FreeType
      run: sudo apt-get update;sudo apt-get install libfreetype6
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive

    - name: List directory contents
      run: pwd; ls -la

    - name: start xvfb
      run:
        Xvfb :0 &
    - name: After checkout, list directory contnts
      run: pwd; ls -la
    - name: Install libraries
      run: |
          sudo apt update
          sudo apt install libgtk2.0-0


    - name: Pull a JavaFX JDK
      run: wget https://cdn.azul.com/zulu/bin/zulu25.32.21-ca-fx-jdk25.0.2-linux_x64.tar.gz

    - name: After JDK download, list directory contnts
      run: pwd; ls -la

    - name: Set Java
      uses: actions/setup-java@v1
      with:
        java-version: 25
        jdkFile: zulu25.32.21-ca-fx-jdk25.0.2-linux_x64.tar.gz
    - name: Shadow Jar
      run: ./gradlew spotlessCheck shadowJar
    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0
    - name: Build/Test with Gradle
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test

    - name: Test Bezier
      run:  xvfb-run -s '-screen 0 1024x768x24' java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -g https://gist.github.com/4aeeaa49bd3a807eed8f8ff3dea84c48.git  BezierEditorDemo.groovy
    - name: start xvfb
      run:
        Xvfb :0 &
    - name: Test Local
      run:  xvfb-run -s '-screen 0 1024x768x24' java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -f kernel-return-test.groovy

    - name: Clean Cad
      run: rm -rf $HOME/bowler-workspace/gitcache/github.com/Hephaestus-Arm/HephaestusArm2
    - name: build Cad
      run:  xvfb-run -s '-screen 0 1024x768x24' java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -g https://github.com/Hephaestus-Arm/HephaestusArm2.git hephaestus.xml

    - name: Zip BowlerStudioInstall
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p artifacts
        find "$HOME/bin/BowlerStudioInstall" -maxdepth 1 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" -o -iname "*.gz" -o -iname "*.7z" -o -iname "*.rar" \) -delete
        cd "$HOME/bin/BowlerStudioInstall"
        zip -r "$GITHUB_WORKSPACE/artifacts/BowlerStudioInstall-linux.zip" .

    - name: Upload BowlerStudioInstall artifact (Linux)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: BowlerStudioInstall-linux
        path: artifacts/BowlerStudioInstall-linux.zip

    - name: Upload bowler-kernel.jar artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: bowler-kernel-jar
        path: build/libs/bowler-kernel.jar

  # ---------------------------------------------------------------------
  # Windows: Shadow Jar build verification only
  # ---------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: List directory contents
      run: Get-Location; Get-ChildItem

    - name: Pull a JavaFX JDK
      run: Invoke-WebRequest -Uri "https://cdn.azul.com/zulu/bin/zulu25.32.21-ca-fx-jdk25.0.2-win_x64.zip" -OutFile "zulu25.32.21-ca-fx-jdk25.0.2-win_x64.zip"

    - name: After JDK download, list directory contents
      run: Get-Location; Get-ChildItem

    - name: Set Java
      uses: actions/setup-java@v1
      with:
        java-version: 25
        jdkFile: zulu25.32.21-ca-fx-jdk25.0.2-win_x64.zip

    - name: Shadow Jar
      run: ./gradlew.bat spotlessCheck test shadowJar

    - name: Confirm Shadow Jar exists
      run: |
        if (Test-Path "build/libs/bowler-kernel.jar") {
          Write-Host "Shadow Jar built successfully:"
          Get-Item build/libs/bowler-kernel.jar
        } else {
          Write-Error "Shadow Jar not found at build/libs/bowler-kernel.jar"
          exit 1
        }

    - name: Zip BowlerStudioInstall
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        Get-ChildItem -Path "$HOME\bin\BowlerStudioInstall" -File | Where-Object { $_.Extension -in ".zip",".tar",".gz",".tgz",".7z",".rar" } | Remove-Item -Force
        Push-Location "$HOME\bin\BowlerStudioInstall"
        Compress-Archive -Path * -DestinationPath "$Env:GITHUB_WORKSPACE\artifacts\BowlerStudioInstall-windows.zip"
        Pop-Location

    - name: Upload BowlerStudioInstall artifact (Windows)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: BowlerStudioInstall-windows
        path: artifacts/BowlerStudioInstall-windows.zip

  # ---------------------------------------------------------------------
  # macOS ARM (native aarch64 JVM): full build + test suite
  # ---------------------------------------------------------------------
  build-macos-arm:
    runs-on: macos-latest # Apple Silicon (arm64) runner

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: List directory contents
      run: pwd; ls -la
    - name: Install Blender, FreeCAD, OpenSCAD, MeshLab
      run: |
        brew install --cask blender freecad meshlab openscad@snapshot
    - name: Add CAD/3D tool binaries to PATH
      run: |
        echo "/Applications/Blender.app/Contents/MacOS" >> $GITHUB_PATH
        echo "/Applications/FreeCAD.app/Contents/MacOS" >> $GITHUB_PATH
        echo "/Applications/OpenSCAD.app/Contents/MacOS" >> $GITHUB_PATH
        echo "/Applications/meshlab.app/Contents/MacOS" >> $GITHUB_PATH
 
    - name: Verify tool installation
      run: |
        which blender || (echo "blender not found on PATH" && exit 1)
        which freecad || (echo "freecad not found on PATH" && exit 1)
        which openscad || (echo "openscad not found on PATH" && exit 1)
        MESHLAB_BIN=$(find /Applications -maxdepth 1 -iname "meshlab*.app" -exec find {} -type f -iname "meshlab" \; 2>/dev/null | head -n1)
        if [ -n "$MESHLAB_BIN" ]; then
          echo "Found MeshLab binary: $MESHLAB_BIN"
          dirname "$MESHLAB_BIN" >> $GITHUB_PATH
        else
          echo "Could not locate a meshlab binary under /Applications. Listing app contents for debugging:"
          find /Applications -maxdepth 1 -iname "meshlab*.app"
          find /Applications -maxdepth 1 -iname "meshlab*.app" -exec find {} -maxdepth 4 \; 2>/dev/null
        fi
        blender --version
        openscad --version

    - name: Pull a JavaFX JDK (macOS arm64)
      run: curl -L -O https://cdn.azul.com/zulu/bin/zulu25.32.21-ca-fx-jdk25.0.2-macosx_aarch64.tar.gz

    - name: After JDK download, list directory contents
      run: pwd; ls -la

    - name: Set Java
      uses: actions/setup-java@v1
      with:
        java-version: 25
        jdkFile: zulu25.32.21-ca-fx-jdk25.0.2-macosx_aarch64.tar.gz

    - name: Shadow Jar
      run: ./gradlew spotlessCheck test shadowJar

    - name: Test Bezier
      run: java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -g https://gist.github.com/4aeeaa49bd3a807eed8f8ff3dea84c48.git BezierEditorDemo.groovy

    - name: Test Local
      run: java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -f kernel-return-test.groovy

    - name: Clean Cad
      run: rm -rf $HOME/bowler-workspace/gitcache/github.com/Hephaestus-Arm/HephaestusArm2

    - name: build Cad
      run: java --enable-preview -Dprism.order=sw -Dprism.verbose=true -jar build/libs/bowler-kernel.jar -g https://github.com/Hephaestus-Arm/HephaestusArm2.git hephaestus.xml

    - name: Zip BowlerStudioInstall
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p artifacts
        find "$HOME/bin/BowlerStudioInstall" -maxdepth 1 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" -o -iname "*.gz" -o -iname "*.7z" -o -iname "*.rar" \) -delete
        cd "$HOME/bin/BowlerStudioInstall"
        zip -r "$GITHUB_WORKSPACE/artifacts/BowlerStudioInstall-macos-arm.zip" .

    - name: Upload BowlerStudioInstall artifact (macOS ARM)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: BowlerStudioInstall-macos-arm
        path: artifacts/BowlerStudioInstall-macos-arm.zip

  # ---------------------------------------------------------------------
  # Release: only runs on tag pushes, once all platform builds succeed
  # ---------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, build-windows, build-macos-arm]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download Linux BowlerStudioInstall artifact
      uses: actions/download-artifact@v4
      with:
        name: BowlerStudioInstall-linux
        path: dist

    - name: Download Windows BowlerStudioInstall artifact
      uses: actions/download-artifact@v4
      with:
        name: BowlerStudioInstall-windows
        path: dist

    - name: Download macOS ARM BowlerStudioInstall artifact
      uses: actions/download-artifact@v4
      with:
        name: BowlerStudioInstall-macos-arm
        path: dist

    - name: Download bowler-kernel.jar artifact
      uses: actions/download-artifact@v4
      with:
        name: bowler-kernel-jar
        path: dist

    - name: List downloaded release assets
      run: ls -la dist

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Linux BowlerStudioInstall asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/BowlerStudioInstall-linux.zip
        asset_name: BowlerStudioInstall-linux.zip
        asset_content_type: application/zip

    - name: Upload Windows BowlerStudioInstall asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/BowlerStudioInstall-windows.zip
        asset_name: BowlerStudioInstall-windows.zip
        asset_content_type: application/zip

    - name: Upload macOS ARM BowlerStudioInstall asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/BowlerStudioInstall-macos-arm.zip
        asset_name: BowlerStudioInstall-macos-arm.zip
        asset_content_type: application/zip

    - name: Upload bowler-kernel.jar asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/bowler-kernel.jar
        asset_name: bowler-kernel.jar
        asset_content_type: application/jar